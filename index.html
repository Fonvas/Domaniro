<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fonvas — Software as a service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141C;
    --paper:#F0F1F5;
    --blue:#3355FF;
    --coral:#FF8A3D;
    --line:#CDD0DE;
    --muted:#5B5E70;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;font-size:16px;line-height:1.55;
  }
  h1,h2,.display{
    font-family:'Space Grotesk', sans-serif;font-weight:600;
    letter-spacing:-0.01em;margin:0;
  }
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:920px;margin:0 auto;padding:0 32px;}

  header{border-bottom:1px solid var(--line);}
  nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 32px;max-width:920px;margin:0 auto;
  }
  .logo{font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:1.2rem;display:flex;align-items:center;gap:8px;}
  .logo .dot{width:9px;height:9px;border-radius:50%;background:var(--blue);}
  .tabs{display:flex;gap:32px;}
  .tabs a{font-size:0.95rem;color:var(--muted);padding:6px 2px;border-bottom:2px solid transparent;transition:color .15s ease, border-color .15s ease;}
  .tabs a:hover{color:var(--ink);border-color:var(--blue);}

  .hero{padding:110px 0 90px;text-align:center;}
  .kicker{font-size:0.95rem;color:var(--blue);font-weight:500;margin-bottom:16px;}
  .hero h1{font-size:clamp(2.2rem, 5vw, 3.2rem);line-height:1.15;max-width:16ch;margin:0 auto;}
  .hero p{margin:22px auto 0;font-size:1.1rem;color:var(--muted);max-width:40ch;}

  section{padding:0 0 96px;}
  .section-head{text-align:center;margin-bottom:40px;}
  .section-head h2{font-size:1.7rem;}

  .product-card{
    border:1px solid var(--line);border-radius:2px;
    padding:40px;display:flex;align-items:center;justify-content:space-between;
    gap:24px;flex-wrap:wrap;background:#fff;
  }
  .product-card h3{font-size:1.3rem;margin-bottom:8px;}
  .product-card p{margin:0;color:var(--muted);max-width:40ch;}
  .btn{
    display:inline-block;padding:13px 24px;border-radius:2px;font-size:0.95rem;font-weight:500;
    border:1px solid var(--ink);background:var(--ink);color:var(--paper);white-space:nowrap;
  }
  .btn:hover{background:var(--blue);border-color:var(--blue);}

  .contact{border-top:1px solid var(--line);padding:64px 0;text-align:center;}
  .contact h2{font-size:1.5rem;margin-bottom:14px;}
  .contact a{color:var(--blue);font-size:1.05rem;}
  .contact a:hover{text-decoration:underline;}

  footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--muted);font-size:0.85rem;}

  @media (max-width: 600px){
    .tabs{gap:20px;}
    .product-card{flex-direction:column;align-items:flex-start;text-align:left;}
  }
</style>
</head>
<body>

<header>
  <nav>
    <div class="logo"><span class="dot"></span>Fonvas</div>
    <div class="tabs">
      <a href="./">Home</a>
      <a href="product/">Products</a>
    </div>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <div class="kicker">Software as a service</div>
      <h1>Fonvas builds software as a service.</h1>
      <p>One product, built to do its job well.</p>
    </div>
  </section>

  <section id="products">
    <div class="wrap">
      <div class="section-head">
        <h2>Products</h2>
      </div>
      <div class="product-card">
        <div>
          <h3>Domaniro</h3>
          <p>See domain strength before you click.</p>
        </div>
        <a href="https://domaniro.fonvas.com/" class="btn">Visit Domaniro</a>
      </div>
    </div>
  </section>
</main>

<div class="contact" id="contact">
  <div class="wrap">
    <h2>Contact us</h2>
    <a href="mailto:fonvas@google.com">fonvas@google.com</a>
  </div>
</div>

<footer>
  © 2026 Fonvas, Inc.
</footer>

</body>
</html>
