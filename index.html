<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fonvas — Software as a service</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --ink: #0F172A;
      --ink-soft: #475569;
      --muted: #6B7280;
      --paper: #FFFFFF;
      --surface: #F8FAFC;
      --line: #E5E7EB;
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-tint: #EFF6FF;
      --radius-sm: 6px;
      --radius-md: 12px;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, .04), 0 12px 32px -12px rgba(15, 23, 42, .12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    h1,
    h2,
    .display {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .wrap {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, .85);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
    }

    nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 24px;
    }

    .logo {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo .dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
    }

    .tabs {
      display: flex;
      gap: 28px;
    }

    .tabs a {
      font-size: 14px;
      color: var(--ink-soft);
      padding: 6px 2px;
      border-bottom: 2px solid transparent;
      transition: color .15s ease, border-color .15s ease;
    }

    .tabs a:hover,
    .tabs a:focus-visible {
      color: var(--ink);
      border-color: var(--blue);
    }

    .hero {
      padding: 88px 0 96px;
      text-align: center;
      background: radial-gradient(600px 300px at 85% -10%, var(--blue-tint), transparent 70%), var(--paper);
    }

    .kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--blue);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .hero h1 {
      font-size: clamp(34px, 4.4vw, 52px);
      line-height: 1.08;
      max-width: 16ch;
      margin: 0 auto;
    }

    .hero p {
      margin: 20px auto 0;
      font-size: 17px;
      line-height: 1.6;
      color: var(--ink-soft);
      max-width: 40ch;
    }

    section {
      padding: 0 0 96px;
    }

    .section-head {
      text-align: center;
      margin-bottom: 40px;
    }

    .section-head h2 {
      font-size: 1.7rem;
    }

    .product-card {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      flex-wrap: wrap;
      background: var(--paper);
      box-shadow: var(--shadow-card);
    }

    .product-card h3 {
      font-size: 1.3rem;
      margin-bottom: 8px;
    }

    .product-card p {
      margin: 0;
      color: var(--ink-soft);
      max-width: 40ch;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      padding: 14px 24px;
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-weight: 600;
      border: 1px solid var(--blue);
      background: var(--blue);
      color: #fff;
      white-space: nowrap;
      transition: background-color 150ms ease, border-color 150ms ease, transform 150ms ease;
    }

    .btn:hover {
      background: var(--blue-dark);
      border-color: var(--blue-dark);
      transform: translateY(-1px);
    }

    .contact {
      border-top: 1px solid var(--line);
      padding: 88px 0;
      text-align: center;
      background: var(--surface);
    }

    .contact h2 {
      font-size: 1.5rem;
      margin-bottom: 14px;
    }

    .contact a {
      color: var(--blue);
      font-size: 1.05rem;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    footer {
      border-top: 1px solid var(--line);
      padding: 32px 0;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      background: var(--surface);
    }

    @media (max-width: 760px) {
      .tabs {
        display: none;
      }

      .product-card {
        flex-direction: column;
        align-items: flex-start;
        text-align: left;
      }
    }
  </style>
</head>

<body>

  <header>
    <nav>
      <div class="logo"><span class="dot"></span>Fonvas</div>
      <div class="tabs">
        <a href="./">Home</a>
        <a href="product/">Products</a>
      </div>
    </nav>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <!-- <div class="kicker">Software as a service</div> -->
        <h1>Fonvas</h1>
        <p>Software as a service</p>
      </div>
    </section>

    <section id="products">
      <div class="wrap">
        <div class="section-head">
          <h2>Products</h2>
        </div>
        <div class="product-card">
          <div>
            <h3>Domaniro</h3>
            <p>View domain strength at Google/Bing search pages.</p>
          </div>
          <a href="product/domaniro/" class="btn">Visit Domaniro</a>
        </div>
      </div>
    </section>
  </main>

  <div class="contact" id="contact">
    <div class="wrap">
      <h2>Contact us</h2>
      <a href="mailto:fonvasdev@gmail.com">fonvasdev@gmail.com</a>
    </div>
  </div>

  <footer>
    © 2026 Fonvas, Inc.
  </footer>

</body>

</html>
